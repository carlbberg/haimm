dimension:
  id: people
  name: People
  subtitle: Supporting cultural and role shifts
  order: 4
  status: stable

threshold:
  pass: 3
  of: 4
  core_required: true

gates:
  - id: pe-g1
    from: exploration
    to: experimentation
    tests: >-
      Whether concerns and hopes about AI adoption were actually surfaced, not just
      announced to.
    rationale: >-
      v0.1's Exploration/Late Status Quo activity is workshops sharing hopes and fears.
      A status quo can look stable purely because people did not say anything, so the
      test is whether concerns actually got voiced.
    criteria:
      - id: pe-g1-c1
        evidence: O
        core: true
        text: >-
          At least one specific concern raised by an employee about AI adoption is
          documented, along with how, or whether, it was addressed.
      - id: pe-g1-c2
        evidence: A
        core: false
        text: >-
          A record exists of a cross-departmental session, not a single-department
          announcement, where AI use cases were discussed.
      - id: pe-g1-c3
        evidence: S
        core: false
        text: >-
          People report they had a chance to voice concerns before pilots started, not
          only after.
      - id: pe-g1-c4
        evidence: A
        core: false
        text: >-
          At least one existing workflow was identified and left unchanged as a
          deliberate decision, not every workflow flagged as an AI opportunity.
    failure_signal: >-
      A well-attended kickoff meeting with no record of a single concern raised.
      Silence read as buy-in, which Satir's model calls late status quo holding, not
      agreement.

  - id: pe-g2
    from: experimentation
    to: integration
    tests: >-
      Whether resistance was worked through via co-creation, not overridden or waited
      out.
    rationale: >-
      v0.1 names Resistance directly and prescribes co-creating pilots with employees
      so their concerns are addressed rather than managed past.
    criteria:
      - id: pe-g2-c1
        evidence: O
        core: true
        text: >-
          Someone who was initially skeptical of an AI pilot can describe what changed
          their view, or can describe that it has not changed and how that is being
          handled.
      - id: pe-g2-c2
        evidence: A
        core: false
        text: >-
          Pilot design decisions (scope, workflow, rollout) show input from people who
          do the work, with at least one instance of the pilot changing because of that
          input.
      - id: pe-g2-c3
        evidence: S
        core: false
        text: >-
          People report resistance was treated as information to act on, not a problem
          to manage past.
      - id: pe-g2-c4
        evidence: A
        core: false
        text: >-
          A documented channel exists for raising concerns during a pilot, distinct from
          the general feedback channel for bugs or feature requests.
    failure_signal: >-
      A pilot that shipped on schedule with resistance noted in a slide and no visible
      response to it. Resistance acknowledged and resistance addressed are different,
      and only one shows up in outcomes.

  - id: pe-g3
    from: integration
    to: optimization
    tests: >-
      Whether capability is concentrated in the people who built their own workarounds
      during the chaos of integration, or has actually spread.
    rationale: >-
      v0.1's Integration/Chaos stage is about roles and responsibilities shifting with
      support. This is where People and Knowledge & Context interact: distribution asks
      whether capability is concentrated in the people who built personal context
      scaffolding while the workflow was still unsettled.
    criteria:
      - id: pe-g3-c1
        evidence: A
        core: true
        text: >-
          At least one person who was not part of the original pilot or early adopters
          is now proficient with the AI-supported workflow, with training or onboarding
          material behind that.
      - id: pe-g3-c2
        evidence: S
        core: false
        text: >-
          People across the team, not just early adopters, report they know how to get
          help when the AI-supported workflow does not work as expected.
      - id: pe-g3-c3
        evidence: O
        core: false
        text: >-
          A recent hire or role-changer can be observed doing the AI-supported workflow
          at a competent level without help from the person who originally built it.
      - id: pe-g3-c4
        evidence: A
        core: false
        text: >-
          Training or resource materials exist and have a recorded date of use by more
          than one person.
    failure_signal: >-
      One or two people who are visibly excellent at the new workflow and everyone else
      routing work through them. Individual mastery reads as team integration on a
      satisfaction survey and is not.

  - id: pe-g4
    from: optimization
    to: continuous-evolution
    tests: >-
      Whether upskilling and culture-building around AI are ongoing, not a one-time
      training push.
    rationale: >-
      Untested against practice. No team in the v0.1 worked example is plotted in
      Continuous Evolution on any dimension, so these criteria are reasoned rather than
      observed. Treat as provisional.
    criteria:
      - id: pe-g4-c1
        evidence: A
        core: true
        text: >-
          A recurring, not one-off, training, upskilling, or knowledge-sharing activity
          related to AI use has run more than once, with attendance or participation
          recorded.
      - id: pe-g4-c2
        evidence: S
        core: false
        text: >-
          People report having growth opportunities tied to how their role is changing
          with AI, not just initial onboarding.
      - id: pe-g4-c3
        evidence: A
        core: false
        text: >-
          A cross-functional group or forum (advisory board, community of practice)
          meets on a recorded cadence to discuss AI-related culture or role questions.
      - id: pe-g4-c4
        evidence: O
        core: false
        text: >-
          Someone can describe a role or skill change they have made in the last cycle
          that they attribute to AI adoption, and what supported it.
    failure_signal: >-
      A single well-attended training from eighteen months ago, cited whenever the
      topic comes up. One event is not a culture, and continuous evolution is exactly
      the distinction a single training cannot demonstrate.
