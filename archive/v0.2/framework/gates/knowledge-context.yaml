dimension:
  id: knowledge-context
  name: Knowledge & Context
  subtitle: Making shared understanding explicit and current
  order: 2
  status: stable

threshold:
  pass: 3
  of: 4
  core_required: true

gates:
  - id: kc-g1
    from: exploration
    to: experimentation
    tests: >-
      Whether the organisation can see its own context.
    rationale: >-
      Until grounding failures are distinguishable from capability failures,
      nothing else in this dimension can be worked on deliberately.
    criteria:
      - id: kc-g1-c1
        evidence: A
        core: false
        text: >-
          At least one recurring workflow has a written inventory of what it depends on
          knowing, with each input marked as documented, held by named individuals, or
          sitting in an unconnected system.
      - id: kc-g1-c2
        evidence: O
        core: false
        text: >-
          In an observed AI-assisted session, the practitioner can say where the context
          they supplied came from.
      - id: kc-g1-c3
        evidence: S
        core: false
        text: >-
          People can describe what context they supply to get good output, rather than
          reporting that they just ask.
      - id: kc-g1-c4
        evidence: O
        core: true
        text: >-
          Someone can give a specific example of AI output that was wrong or unusable
          because of missing or incorrect grounding rather than model capability.
    failure_signal: >-
      The team reports that AI works fine and cannot produce a single grounding failure.
      That almost never means grounding is good. It means grounding failures are being
      absorbed as capability limits, which is the default state and the reason this gate
      exists.

  - id: kc-g2
    from: experimentation
    to: integration
    tests: >-
      Whether context has crossed from individual to shared.
    rationale: >-
      This is the fork where privatised grounding either takes hold or does not.
    criteria:
      - id: kc-g2-c1
        evidence: A
        core: false
        text: >-
          At least one context artifact is used by more than one person and was not
          authored by one of them alone.
      - id: kc-g2-c2
        evidence: A
        core: true
        text: >-
          That artifact has been substantively changed by at least two different people.
      - id: kc-g2-c3
        evidence: S
        core: false
        text: >-
          Two or more people independently name the same artifact as where they get
          grounding for a given task.
      - id: kc-g2-c4
        evidence: O
        core: false
        text: >-
          In an observed session, someone reaches for the shared artifact instead of
          reconstructing context from memory.
    failure_signal: >-
      A well-populated shared folder where authorship and editing are concentrated in one
      person. Document volume is externalisation without sharing. It passes an artifact
      count and fails this gate, and the second criterion is what catches it.

  - id: kc-g3
    from: integration
    to: optimization
    tests: >-
      Whether shared context is owned, current, arbitrated, and reachable at the moment
      of work.
    rationale: >-
      The fourth criterion tests shared understanding directly rather than inferring it
      from artifacts. It is the strongest single item in the instrument and also the most
      likely to be skipped, which is why it is marked core.
    criteria:
      - id: kc-g3-c1
        evidence: A
        core: false
        text: >-
          Every context artifact the team relies on has a named owner and a last
          substantive change inside an agreed freshness window.
      - id: kc-g3-c2
        evidence: O
        core: false
        text: >-
          The team can describe a specific conflict between two context sources and how
          one was made authoritative.
      - id: kc-g3-c3
        evidence: A
        core: false
        text: >-
          The context the team has agreed on is reachable from the AI tools people
          actually use, without manual re-supply.
      - id: kc-g3-c4
        evidence: S
        core: true
        text: >-
          Two people and one AI session, asked the same question the work depends on,
          produce substantially the same answer.
    failure_signal: >-
      Documented, owned, current, and still re-supplied by hand in every session. That
      profile passes an artifact audit and fails the gate, and it is the unreachable
      sources pattern.

  - id: kc-g4
    from: optimization
    to: continuous-evolution
    tests: >-
      Whether context is genuinely managed as an asset, including the half that is about
      people rather than AI.
    rationale: >-
      Untested against practice. No team in the v0.1 worked example is plotted in
      Continuous Evolution on any dimension, so these criteria are reasoned rather than
      observed. Treat as provisional.
    criteria:
      - id: kc-g4-c1
        evidence: A
        core: true
        text: >-
          Context has been deliberately retired or deprecated in the last review cycle,
          not only added.
      - id: kc-g4-c2
        evidence: A
        core: false
        text: >-
          AI output routinely returns to shared stores as durable context, with at least
          one traceable instance.
      - id: kc-g4-c3
        evidence: S
        core: false
        text: >-
          New people reach working competence at a rate the team can point to, and
          attribute part of it to available shared context.
      - id: kc-g4-c4
        evidence: S
        core: false
        text: >-
          The team assesses shared understanding among people, not only context available
          to AI, and can say whether it has risen or fallen.
    failure_signal: >-
      A growing, well-owned context estate with no deletions and no measure of the
      human-to-human half. It looks like Continuous Evolution and is Optimization with
      momentum. Every organisation adds context and almost none subtracts it, which is
      why deliberate retirement is the honest test of a lifecycle.
