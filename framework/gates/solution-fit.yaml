dimension:
  id: solution-fit
  name: Solution Fit
  subtitle: Matching AI capabilities to real user needs
  order: 1
  status: draft

threshold:
  pass: 3
  of: 4
  core_required: true

gates:
  - id: sf-g1
    from: exploration
    to: experimentation
    tests: >-
      Whether a candidate AI use case is grounded in a real user need rather than
      worked backward from available AI capability.
    rationale: >-
      Technology push is the default failure mode the v0.1 text itself names: capability
      without an attached user pain or gain. Perceived Usefulness (TAM) requires the use
      case to answer a real question about the person's own workflow.
    criteria:
      - id: sf-g1-c1
        evidence: A
        core: true
        text: >-
          A written artifact from user research (interview notes, a job-to-be-done
          statement, workshop output) names the specific pain point or job a candidate
          AI use case addresses, produced before or independent of any AI proof of concept.
      - id: sf-g1-c2
        evidence: A
        core: false
        text: >-
          At least one candidate use case has been explicitly rejected or deprioritised
          because it fell outside AI's likely capability range for the task, with the
          reasoning recorded.
      - id: sf-g1-c3
        evidence: O
        core: false
        text: >-
          Someone can describe, in an observed conversation, what would have to be true
          of the user's workflow for the use case to be worth pursuing, not just what the
          AI can technically do.
      - id: sf-g1-c4
        evidence: S
        core: false
        text: >-
          People closest to the workflow say they were consulted before the use case was
          selected, not informed about it afterward.
    failure_signal: >-
      A backlog of AI use cases that map cleanly onto AI capabilities (summarisation,
      drafting, classification) with no user-research artifact behind any of them.
      Capability push dressed as demand pull, and it passes a self-report check every
      time because nobody has to admit they didn't ask.

  - id: sf-g2
    from: experimentation
    to: integration
    tests: >-
      Whether pilot feedback actually reshaped the solution, not just produced usage
      and satisfaction numbers.
    rationale: >-
      v0.1 stresses co-creation and iterative testing that resolves usability
      challenges. A pilot that ships unchanged despite feedback was not actually testing
      fit.
    criteria:
      - id: sf-g2-c1
        evidence: A
        core: true
        text: >-
          At least one documented change to the AI solution or workflow was made
          directly in response to pilot user feedback, with a before-and-after
          description.
      - id: sf-g2-c2
        evidence: O
        core: false
        text: >-
          A pilot participant can describe a specific problem they raised and what
          happened to it: fixed, explained, or explicitly declined.
      - id: sf-g2-c3
        evidence: A
        core: false
        text: >-
          Pilot participants include people who do the work daily, not only early
          adopters or the team that built the pilot.
      - id: sf-g2-c4
        evidence: S
        core: false
        text: >-
          Participants report the pilot changed based on their input, not only that they
          were asked for input.
    failure_signal: >-
      A pilot that ran cleanly, gathered high satisfaction scores, and shipped
      unchanged. High Effort Expectancy scores with zero documented product changes
      usually means the survey measured politeness, not fit.

  - id: sf-g3
    from: integration
    to: optimization
    tests: >-
      Whether the fit demonstrated in one team survives being used somewhere else.
    rationale: >-
      Facilitating Conditions (UTAUT) generalise across a team, but the specific tacit
      setup that made a pilot work often does not travel. This is where the Solution Fit
      and Knowledge & Context dimensions interact: transferability is whether the
      context that made a pilot work exists anywhere other than the pilot team.
    criteria:
      - id: sf-g3-c1
        evidence: A
        core: true
        text: >-
          The context, configuration, or setup that made the pilot work (prompts,
          instructions, integrations, data access) is documented somewhere other than
          the pilot team's own heads or private files.
      - id: sf-g3-c2
        evidence: O
        core: false
        text: >-
          A second team, given that documentation and no help from the pilot team, gets
          working value from the AI solution within one working session.
      - id: sf-g3-c3
        evidence: A
        core: false
        text: >-
          Usage or outcome data exists for the AI solution across more than one team or
          workflow, not only the pilot's original context.
      - id: sf-g3-c4
        evidence: S
        core: false
        text: >-
          Teams outside the original pilot report they had what they needed to adopt the
          solution, rather than needing informal help from the pilot team.
    failure_signal: >-
      A solution that worked in the pilot and stalls the moment it is handed to a second
      team, because the fit was actually a fit between the AI and the pilot team's
      accumulated context, not the workflow itself.

  - id: sf-g4
    from: optimization
    to: continuous-evolution
    tests: >-
      Whether user needs are actively re-checked rather than assumed stable.
    rationale: >-
      Untested against practice. No team in the v0.1 worked example is plotted in
      Continuous Evolution on any dimension, so these criteria are reasoned rather than
      observed. Treat as provisional.
    criteria:
      - id: sf-g4-c1
        evidence: A
        core: true
        text: >-
          A reassessment of user needs against the current AI solution has happened in
          the last review cycle, with a record of what was reconfirmed or changed.
      - id: sf-g4-c2
        evidence: A
        core: false
        text: >-
          At least one AI-supported workflow has been retired, narrowed, or redirected
          because the underlying user need changed, not only expanded.
      - id: sf-g4-c3
        evidence: S
        core: false
        text: >-
          Users report being asked about their current needs on a predictable cadence,
          not only when something breaks.
      - id: sf-g4-c4
        evidence: O
        core: false
        text: >-
          Someone can describe how a recent AI capability change (new model, new
          feature) was evaluated against actual user need rather than adopted because it
          was available.
    failure_signal: >-
      A steady stream of new AI capability adopted as soon as it ships, with no
      corresponding record of a user need reassessment. Capability-led expansion dressed
      as continuous evolution.
